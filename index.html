<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08090d">
  <meta name="description" content="MADARA X SHELBY TUBE — Ton univers vidéo original.">
  <link rel="manifest" href="manifest.json">
  <title>MADARA X SHELBY TUBE</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root{--red:#e50914;--red2:#ff1a26;--bg:#07080c;--panel:#12141c;--muted:#8b8ea0;--border:#222531;}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:white;font-family:'Inter',Arial,sans-serif}
    button,input{font:inherit} button{cursor:pointer}
    #intro{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(800px 500px at 50% -10%, #2a0f14 0%, transparent 70%), #07080c;transition:opacity .9s, transform .9s}
    #intro.hide{opacity:0;transform:scale(1.08);pointer-events:none;visibility:hidden}
    .intro-logo{width:110px;height:110px;display:grid;place-items:center;border:1px solid #3a1a1e;border-radius:32px;background:linear-gradient(180deg,#1a1517,#0f1014);font-size:36px;font-weight:900;box-shadow:0 20px 60px #e5091433}
    .intro-title{margin-top:28px;font-size:42px;font-weight:900;text-align:center}
    .intro-title b{color:var(--red)}
    .intro-sub{margin:14px 0 0;color:var(--muted);letter-spacing:4px;font-size:10px;font-weight:700;text-transform:uppercase}
    .intro-line{width:220px;height:2px;margin-top:28px;background:#1c1e2a;overflow:hidden}
    .intro-line i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--red),var(--red2));animation:loadLine 2.2s forwards}
    @keyframes loadLine{0%{width:0%} 100%{width:100%}}
    header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:14px 4%;background:#08090de8;border-bottom:1px solid var(--border);backdrop-filter:blur(18px)}
    .brand{font-size:17px;font-weight:900} .brand i{font-style:normal;color:var(--red)}
